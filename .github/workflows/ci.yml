name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python tests
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Web typecheck and build
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm run build
